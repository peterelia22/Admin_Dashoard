name: aman24_admin
description: "Aman24 Admin Dashboard App."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.8.1

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # Firebase packages
  firebase_core: ^3.15.2
  firebase_auth: ^5.2.1
  cloud_firestore: ^5.4.2

  awesome_snackbar_content: ^0.1.7
  flutter_bloc: ^9.1.1
  get_it: ^9.0.5
  shared_preferences: ^2.5.3
  dartz: ^0.10.1
  image_picker: ^1.2.0
  skeletonizer: ^2.1.0
  video_player: ^2.9.2
  flutter_launcher_icons: ^0.14.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/

flutter_launcher_icons:
  android: true
  ios: true
  web:
    generate: true
    image_path: "assets/images/logo.png"
  image_path: "assets/images/logo.png"
  min_sdk_android: 21
